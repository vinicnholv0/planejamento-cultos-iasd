{% extends "base.html" %}

{% block titulo_pagina %}
Nova Escala Mensal
{% endblock %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>
            Nova Escala Mensal
        </h2>

        <p class="text-muted mb-0">
            Crie a escala de um mês.
        </p>

    </div>

    <a
        href="/escalas"
        class="btn btn-secondary">

        <i class="bi bi-arrow-left"></i>
        Voltar

    </a>

</div>


<div class="card">

    <div class="card-header">

        <strong>

            <i class="bi bi-calendar-month"></i>

            Período da Escala

        </strong>

    </div>


    <div class="card-body">

        <form
            method="POST"
            action="/nova-escala-mensal">


            <div class="row">


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Mês
                    </label>

                    <select
                        name="mes"
                        class="form-control"
                        required>

                        <option value="">
                            Selecione o mês
                        </option>

                        <option value="1">
                            Janeiro
                        </option>

                        <option value="2">
                            Fevereiro
                        </option>

                        <option value="3">
                            Março
                        </option>

                        <option value="4">
                            Abril
                        </option>

                        <option value="5">
                            Maio
                        </option>

                        <option value="6">
                            Junho
                        </option>

                        <option value="7">
                            Julho
                        </option>

                        <option value="8">
                            Agosto
                        </option>

                        <option value="9">
                            Setembro
                        </option>

                        <option value="10">
                            Outubro
                        </option>

                        <option value="11">
                            Novembro
                        </option>

                        <option value="12">
                            Dezembro
                        </option>

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Ano
                    </label>

                    <input
                        type="number"
                        name="ano"
                        class="form-control"
                        value="2026"
                        min="2026"
                        required>

                </div>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Observações
                </label>

                <textarea
                    name="observacoes"
                    class="form-control"
                    rows="4"
                    placeholder="Observações gerais da escala..."></textarea>

            </div>


            <div class="d-flex gap-2">

                <a
                    href="/escalas"
                    class="btn btn-secondary">

                    Cancelar

                </a>


                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle"></i>

                    Criar Escala

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
