
{% extends "base.html" %}

{% block titulo_pagina %}
Editar Participante
{% endblock %}

{% block conteudo %}

<h2>Editar Participante</h2>

<form method="POST" class="form-participante">

    <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" id="nome" name="nome"
               class="form-control"
               value="{{ participante[1] or '' }}" required>
    </div>

    <div class="mb-3">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="text" id="telefone" name="telefone"
               class="form-control"
               value="{{ participante[2] or '' }}">
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" name="email"
               class="form-control"
               value="{{ participante[3] or '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Funções</label>

        <div class="lista-funcoes">
            {% for funcao in funcoes %}
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       id="funcao_{{ funcao[0] }}"
                       name="funcoes"
                       value="{{ funcao[0] }}"
                       {% if funcao[0]|string in funcoes_selecionadas %}checked{% endif %}>

                <label class="form-check-label"
                       for="funcao_{{ funcao[0] }}">
                    {{ funcao[1] }}
                </label>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="mb-3">
        <label for="observacoes" class="form-label">Observações</label>
        <textarea id="observacoes" name="observacoes"
                  class="form-control">{{ participante[4] or '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-success">
        <i class="bi bi-check-circle"></i> Salvar Alterações
    </button>

    <a href="/participantes" class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
