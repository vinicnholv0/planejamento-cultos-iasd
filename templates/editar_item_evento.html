{% extends "base.html" %}

{% block titulo_pagina %}
Editar Item da Programação
{% endblock %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>
            Editar Item
        </h2>

        <p class="text-muted mb-0">
            Altere as informações da programação.
        </p>

    </div>

    <a
        href="/programacao-evento/{{ evento_id }}"
        class="btn btn-secondary">

        <i class="bi bi-arrow-left"></i>
        Voltar

    </a>

</div>


<div class="card">

    <div class="card-header">

        <strong>

            <i class="bi bi-pencil"></i>

            Editar programação

        </strong>

    </div>


    <div class="card-body">

        <form
            method="POST"
            action="/editar-item-evento/{{ item[0] }}">

            <div class="row">


                <!-- HORÁRIO -->

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Horário
                    </label>

                    <input
                        type="time"
                        name="horario"
                        class="form-control"
                        value="{{ item[2] or '' }}">

                </div>


                <!-- FUNÇÃO -->

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Função
                    </label>

                    <select
                        name="funcao"
                        class="form-control"
                        required>

                        <option value="">
                            Selecione a função
                        </option>

                        {% for funcao in funcoes %}

                        <option
                            value="{{ funcao[1] }}"
                            {% if item[3] == funcao[1] %}
                            selected
                            {% endif %}>

                            {{ funcao[1] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- PARTICIPANTE -->

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Participante
                    </label>

                    <select
                        name="participante"
                        class="form-control">

                        <option value="">
                            Selecione
                        </option>

                        {% for participante in participantes %}

                        <option
                            value="{{ participante[0] }}"
                            {% if item[4]|string == participante[0]|string %}
                            selected
                            {% endif %}>

                            {{ participante[1] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- OBSERVAÇÃO -->

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Observação
                    </label>

                    <input
                        type="text"
                        name="observacao"
                        class="form-control"
                        value="{{ item[5] or '' }}"
                        placeholder="Opcional">

                </div>

            </div>


            <hr>


            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle"></i>

                    Salvar Alterações

                </button>


                <a
                    href="/programacao-evento/{{ evento_id }}"
                    class="btn btn-secondary">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
